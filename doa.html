<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#43a047">
<title>Doa Harian</title>
<style>
  /* ===== TAMPILAN ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: #f3e5f5; font-family: sans-serif; color: #4a148c;
  }
  .arab { font-family: 'Noto Naskh Arabic', 'Amiri', 'Traditional Arabic', 'Geeza Pro', serif; }

  #bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 12px; align-items: center;
    padding: 10px; background: #ce93d8;
  }
  #bar a {
    font-size: 26px; padding: 8px 16px; border-radius: 16px;
    border: 4px solid #fff; background: #fff; text-decoration: none;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  #bar h1 { margin: 0; font-size: 24px; }

  /* Daftar doa: dua kolom kartu besar */
  #kisi {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
    max-width: 560px; margin: 0 auto; padding: 16px;
  }
  .kartuDoa {
    min-height: 130px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    border: 5px solid #fff; border-radius: 24px; background: #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,.25); cursor: pointer; color: #4a148c;
    font-size: 18px; font-weight: bold; padding: 8px;
  }
  .kartuDoa .ikon { font-size: 50px; line-height: 1; }
  .kartuDoa:active { transform: scale(.95); }

  #catatan { text-align: center; font-size: 13px; opacity: .75; padding: 0 16px 24px; }

  /* Kartu besar saat doa dibuka */
  #detail {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.5); align-items: center; justify-content: center;
  }
  #detail.tampil { display: flex; }
  #isiDetail {
    width: min(94vw, 460px); max-height: 92vh; overflow-y: auto;
    background: #fffde7; border-radius: 28px; padding: 18px;
    text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #judulDoa { font-size: 24px; font-weight: bold; margin-bottom: 6px; }
  #arabDoa { font-size: 38px; line-height: 2; direction: rtl; color: #1b4332; }
  #latinDoa { font-size: 18px; font-style: italic; margin: 8px 0; color: #5d4037; }
  #artiDoa { font-size: 17px; margin-bottom: 14px; color: #37474f; }
  .navigasi { display: flex; gap: 12px; justify-content: center; }
  .navigasi button {
    font-size: 32px; width: 68px; height: 68px; border-radius: 20px;
    border: 4px solid #fff; background: #e1bee7; cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
</style>
</head>
<body>

<div id="bar">
  <a href="index.html" title="Menu">🏠</a>
  <h1>Doa Harian</h1>
</div>

<div id="kisi"></div>
<div id="catatan">Teks doa sebaiknya dicek bersama ustadz/ustadzah sebelum dipakai belajar.</div>

<div id="detail">
  <div id="isiDetail">
    <div id="judulDoa"></div>
    <div id="arabDoa" class="arab"></div>
    <div id="latinDoa"></div>
    <div id="artiDoa"></div>
    <div class="navigasi">
      <button id="tombolKiri" title="Sebelumnya">◀</button>
      <button id="tombolSuara" title="Dengarkan">🔊</button>
      <button id="tombolKanan" title="Berikutnya">▶</button>
      <button id="tombolTutup" title="Tutup">✖</button>
    </div>
  </div>
</div>

<script>
  // ===== DATA DOA =====
  // Menambah doa: salin satu blok { ... } lalu isi.
  // Suara (opsional): letakkan di folder doa/ dengan nama 1.mp3, 2.mp3, ... sesuai urutan di bawah.
  // Kalau file suaranya belum ada, doa tetap tampil, hanya tanpa bunyi.
  const DOA = [
    { ikon: '🍚', judul: 'Sebelum makan',
      arab: 'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',
      latin: 'Allahumma baarik lanaa fiimaa razaqtanaa wa qinaa ‘adzaaban naar.',
      arti: 'Ya Allah, berkahilah rezeki yang Engkau berikan kepada kami dan jagalah kami dari siksa neraka.' },
    { ikon: '😋', judul: 'Sesudah makan',
      arab: 'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ',
      latin: 'Alhamdulillaahilladzii ath‘amanaa wa saqaanaa wa ja‘alanaa muslimiin.',
      arti: 'Segala puji bagi Allah yang telah memberi kami makan dan minum, serta menjadikan kami orang-orang muslim.' },
    { ikon: '😴', judul: 'Sebelum tidur',
      arab: 'بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ',
      latin: 'Bismika Allaahumma ahyaa wa bismika amuut.',
      arti: 'Dengan menyebut nama-Mu ya Allah, aku hidup dan aku mati.' },
    { ikon: '🌞', judul: 'Bangun tidur',
      arab: 'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',
      latin: 'Alhamdulillaahilladzii ahyaanaa ba‘da maa amaatanaa wa ilaihin nusyuur.',
      arti: 'Segala puji bagi Allah yang telah menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dikembalikan.' },
    { ikon: '🚽', judul: 'Masuk kamar mandi',
      arab: 'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ',
      latin: 'Allaahumma innii a‘uudzu bika minal khubutsi wal khabaa-its.',
      arti: 'Ya Allah, aku berlindung kepada-Mu dari setan laki-laki dan setan perempuan.' },
    { ikon: '🧼', judul: 'Keluar kamar mandi',
      arab: 'غُفْرَانَكَ',
      latin: 'Ghufraanaka.',
      arti: 'Aku memohon ampunan-Mu.' },
    { ikon: '👨‍👩‍👧', judul: 'Untuk orang tua',
      arab: 'رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',
      latin: 'Rabbighfir lii wa li waalidayya warhamhumaa kamaa rabbayaanii shaghiiraa.',
      arti: 'Ya Tuhanku, ampunilah aku dan kedua orang tuaku, dan sayangilah mereka sebagaimana mereka mendidikku waktu kecil.' },
    { ikon: '🚗', judul: 'Naik kendaraan',
      arab: 'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ',
      latin: 'Subhaanalladzii sakhkhara lanaa haadzaa wa maa kunnaa lahuu muqriniin. Wa innaa ilaa rabbinaa lamunqalibuun.',
      arti: 'Maha Suci Allah yang telah menundukkan kendaraan ini bagi kami, padahal kami tidak mampu menguasainya. Dan sesungguhnya kepada Tuhan kami, kami akan kembali.' },
    { ikon: '🚶', judul: 'Keluar rumah',
      arab: 'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',
      latin: 'Bismillaah, tawakkaltu ‘alallaah, laa haula wa laa quwwata illaa billaah.',
      arti: 'Dengan nama Allah, aku bertawakal kepada Allah. Tiada daya dan kekuatan kecuali dengan pertolongan Allah.' },
    { ikon: '📚', judul: 'Menambah ilmu',
      arab: 'رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا',
      latin: 'Rabbi zidnii ‘ilmaa, warzuqnii fahmaa.',
      arti: 'Ya Tuhanku, tambahkanlah ilmu kepadaku dan berilah aku pemahaman.' }
  ];

  // ===== DAFTAR KARTU =====
  const kisi = document.getElementById('kisi');
  DOA.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'kartuDoa';
    b.innerHTML = '<span class="ikon"></span><span class="teks"></span>';
    b.children[0].textContent = d.ikon;
    b.children[1].textContent = d.judul;
    b.onclick = () => buka(i);
    kisi.appendChild(b);
  });

  // ===== SUARA (opsional) =====
  let audioAktif = null;
  function putarSuara(i) {
    try {
      if (audioAktif) audioAktif.pause();
      audioAktif = new Audio('doa/' + (i + 1) + '.mp3');
      audioAktif.play().catch(() => {});
    } catch (e) {}
  }

  // ===== KARTU BESAR =====
  const detail = document.getElementById('detail');
  let nomor = 0;

  function buka(i) {
    nomor = (i + DOA.length) % DOA.length;
    const d = DOA[nomor];
    document.getElementById('judulDoa').textContent = d.ikon + ' ' + d.judul;
    document.getElementById('arabDoa').textContent = d.arab;
    document.getElementById('latinDoa').textContent = d.latin;
    document.getElementById('artiDoa').textContent = '“' + d.arti + '”';
    document.getElementById('isiDetail').scrollTop = 0;
    detail.classList.add('tampil');
    putarSuara(nomor);
  }

  document.getElementById('tombolKanan').onclick = () => buka(nomor + 1);
  document.getElementById('tombolKiri').onclick  = () => buka(nomor - 1);
  document.getElementById('tombolSuara').onclick = () => putarSuara(nomor);
  document.getElementById('tombolTutup').onclick = () => {
    detail.classList.remove('tampil');
    if (audioAktif) audioAktif.pause();
  };
</script>
</body>
</html>
